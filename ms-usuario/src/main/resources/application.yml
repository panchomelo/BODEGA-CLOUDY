# ═══════════════════════════════════════════════════
# ms-usuario · application.yml
# Puerto: 8082  |  Schema: identidad_db (dominio identidad)
# Sin Spring Security / JWT de momento (se añadirá después).
# ═══════════════════════════════════════════════════
server:
  port: 8082

spring:
  application:
    name: ms-usuario
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:identidad_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT (HS256 compartido; solo ms-usuario firma).
# En Compose llegan por env; en IDE usar variables de entorno o defaults.
jwt:
  secret: ${JWT_SECRET:changeme-dev-secret-min-32-chars-1234567890}
  access-expiration: ${JWT_ACCESS_EXP:3600}
  refresh-expiration: ${JWT_REFRESH_EXP:604800}

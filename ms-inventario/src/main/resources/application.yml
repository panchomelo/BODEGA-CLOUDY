# ═══════════════════════════════════════════════════
# ms-inventario · application.yml (WebClient)
# Puerto: 8084  |  Schema: operacion_db (dominio operación)
# Arrancar PRIMERO ms-producto (puerto 8083).
# ═══════════════════════════════════════════════════
server:
  port: 8084

spring:
  application:
    name: ms-inventario
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:operacion_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# URL de ms-producto. AppConfig la inyecta con @Value.
ms:
  producto:
    url: ${MS_PRODUCTO_URL:http://localhost:8083}

# JWT: valida con la copia local del secreto compartido.
jwt:
  secret: ${JWT_SECRET:changeme-dev-secret-min-32-chars-1234567890}
